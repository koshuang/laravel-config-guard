name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  composer-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer validate --strict

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Testbench 10 targets Laravel 12; Testbench 11 targets Laravel 13.
          # Laravel 13 requires PHP 8.3+, so PHP 8.2 is intentionally covered only with Testbench 10.
          - php: '8.2'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^11.0'
          - php: '8.4'
            testbench: '^11.0'
          - php: '8.5'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update

      - run: composer update --prefer-dist --no-interaction

      - run: composer test

  lowest-supported:
    name: Lowest supported dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Select Laravel 12 / Testbench 10 compatibility line
        run: composer require "orchestra/testbench:^10.0" --dev --no-update

      - name: Install lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction

      - run: composer test

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Resolve dependencies
        run: composer update --prefer-dist --no-interaction

      - run: composer audit

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - run: composer install --prefer-dist --no-interaction

      - name: Run coverage
        run: vendor/bin/phpunit --coverage-text=coverage.txt --colors=never

      - name: Enforce 85% line coverage
        run: |
          cat coverage.txt
          php -r '$text = file_get_contents("coverage.txt"); if (! preg_match("/Lines:\\s+([0-9.]+)%/", $text, $matches)) { fwrite(STDERR, "Unable to read line coverage.\n"); exit(2); } $coverage = (float) $matches[1]; echo "Line coverage: {$coverage}%\n"; if ($coverage < 85) { fwrite(STDERR, "Line coverage must be at least 85%.\n"); exit(1); }'

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: composer analyse

  code-style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: composer format:test
