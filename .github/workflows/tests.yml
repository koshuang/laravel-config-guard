name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^11.0'
          - php: '8.4'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update

      - run: composer update --prefer-dist --no-interaction

      - run: composer test

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: composer analyse

  code-style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: composer format:test
